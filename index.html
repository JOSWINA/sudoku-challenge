<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Sudoku Challenge</title>
 
    <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
    <!-- Player Name Screen -->
    <div id="name-screen" class="overlay">
        <div class="name-card">
 
            <h1>Sudoku Challenge</h1>
 
            <p>Enter your name to start</p>
 
            <input
                type="text"
                id="player-name"
                placeholder="Your name"
                maxlength="20"
                autocomplete="off"
            >
 
            <button id="start-game">
                Start Game
            </button>
 
        </div>
    </div>
 
 
    <!-- Main Game -->
    <div class="game-container">
 
        <h1>Sudoku Challenge</h1>
 
        <div class="player-display">
            Player:
            <strong id="current-player">Player</strong>
        </div>
 
        <div class="game-info">
 
            <div>
                <span>⏱️ Time</span>
                <strong id="timer">00:00</strong>
            </div>
 
            <div>
                <span>❌ Mistakes</span>
                <strong id="mistakes">0</strong>
            </div>
 
            <div>
                <span>🏆 Score</span>
                <strong id="score">0</strong>
            </div>
 
        </div>
 
 
        <div id="sudoku-board"></div>
 
 
        <div class="buttons">
 
            <button id="new-game">
                New Game
            </button>
 
            <button id="check-game">
                Check
            </button>
 
            <button id="leaderboard-button">
                🏆 Leaderboard
            </button>
 
        </div>
 
 
        <div id="message"></div>
 
 
        <!-- Leaderboard -->
        <div id="leaderboard" class="leaderboard hidden">
 
            <div class="leaderboard-header">
 
                <h2>🏆 Leaderboard</h2>
 
                <button id="close-leaderboard">
                    ×
                </button>
 
            </div>
 
            <div id="leaderboard-list"></div>
 
        </div>
 
    </div>
 
 
    <script src="script.js"></script>
 
</body>
</html>
